absolute_urls: true

languages:
  supported:
    - ru
    - en
  default_lang: ru
  include_default_lang: false

home:
  alias: '/home'

pages:
  theme: quark
  markdown:
    extra: false
  process:
    markdown: true
    twig: false

cache:
  enabled: true
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: false
  auto_reload: false
  autoescape: true

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: true
  js_module_pipeline: false
  js_minify: true

errors:
  display: true
  log: true

debugger:
  enabled: false
  twig: true
  shutdown:
    close_connection: true

gpm:
  verify_peer: true

strict_mode:
  blueprint_compat: true

# Media upload settings to prevent filename issues
media:
  enable_media_timestamp: false
  auto_metadata_exif: false
  
# Image settings
images:
  default_image_quality: 85
  cache_all: false
  auto_fix_orientation: true
  seofriendly: false

# Form settings for file uploads
forms:
  files:
    multiple: true
    limit: 10
    filesize: 8
    accept:
      - 'image/*'
    avoid_overwriting: false
    random_name: true


