; PHP Configuration for Grav Admin
; This file overrides default PHP settings for file uploads

; File upload settings
file_uploads = On
max_file_uploads = 200
upload_max_filesize = 512M
post_max_size = 1024M

; Execution time settings
max_execution_time = 0
max_input_time = 0
max_input_time = 0

; Memory settings
memory_limit = 256M

; Error reporting (for development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Input variables and multipart limits for Grav Admin
max_input_vars = 100000
max_multipart_body_parts = 50000
max_input_nesting_level = 128

; Session settings for admin security
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_strict_mode = 1

; Additional settings for Grav Admin compatibility
auto_detect_line_endings = Off
default_charset = "UTF-8"
mbstring.func_overload = 0
; mbstring.internal_encoding = "UTF-8"  ; deprecated, removed

; SSL/TLS settings for SMTP
allow_url_fopen = On
default_socket_timeout = 60
; More permissive SSL settings for email compatibility
; openssl.cafile = /etc/ssl/certs/ca-certificates.crt
; openssl.capath = /etc/ssl/certs

; Form processing and timeout settings
post_max_size = 1024M
max_file_uploads = 200
upload_max_filesize = 512M
max_input_vars = 100000
max_multipart_body_parts = 50000

; Socket timeout settings to prevent SMTP hangs
default_socket_timeout = 30
