server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name expoland-group.com.ru www.expoland-group.com.ru;
    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    # Allow Let's Encrypt ACME challenge over HTTP
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name expoland-group.com.ru www.expoland-group.com.ru;
    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/expoland-group.com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expoland-group.com.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Allow Let's Encrypt ACME challenge over HTTPS too
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    # Primary routing: static first, then front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param HTTPS on;
    }

    # Cache headers for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security: deny access to hidden files and sensitive paths
    location ~* /\.(?:git|hg|svn) {
        deny all;
    }

    location ~ /\.[^/]+$ {
        deny all;
    }

    location ~* /(LICENSE\.txt|composer\.(json|lock))$ {
        deny all;
    }

    # Do not serve application cache/log directories directly
    location ~* /(cache|logs)/ {
        deny all;
    }
}


