; PHP Configuration for Grav Admin
; This file overrides default PHP settings for file uploads

; File upload settings
file_uploads = On
max_file_uploads = 20
upload_max_filesize = 32M
post_max_size = 128M

; Execution time settings
max_execution_time = 300
max_input_time = 300

; Memory settings
memory_limit = 256M

; Error reporting (for development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
